# Jackett next to an existing FlareSolverr.
#
# Paste this service into a compose project that already runs FlareSolverr, so
# Jackett reaches it over the project network as http://flaresolverr:8191 and no
# second headless browser is started. Nothing here is published to the internet:
# JACKETT_BIND defaults to loopback and is meant to be set to a Tailscale (or
# other private) address, the same way the rest of the stack is bound.
#
#   JACKETT_BIND=$(tailscale ip -4)
#
# Sizing: Jackett is a .NET service and settles around 150-200 MB. On a 1 GB VPS
# that already runs a VPN and a headless browser this is the last container that
# fits - check `free -m` before and after, and give the box 2 GB of swap if the
# available figure drops under ~150 MB.

services:
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: tr-jackett
    restart: unless-stopped
    depends_on:
      - flaresolverr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      AUTO_UPDATE: "true"
    volumes:
      - ./jackett:/config
    ports:
      - "${JACKETT_BIND:-127.0.0.1}:${JACKETT_PORT:-9117}:9117"
    # Keep the VPN services off the OOM killer's shortlist, as the rest of the
    # stack already does.
    oom_score_adj: 600
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
